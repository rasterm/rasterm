name: rasterm

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rasterm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: MSVC x64 ${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Configure rasterm
        run: >-
          cmake -S . -B build/ci -A x64
          -DRASTERM_BUILD_TESTS=ON
          -DRASTERM_BUILD_BENCHMARKS=ON
          -DRASTERM_WARNINGS_AS_ERRORS=ON

      - name: Build and Test rasterm
        run: |
          cmake --build build/ci --config ${{ matrix.configuration }} --parallel
          ctest --test-dir build/ci -C ${{ matrix.configuration }} --output-on-failure

      - name: Build rasterm Examples
        run: |
          cmake -S apps/examples -B apps/examples/build -A x64
          cmake --build apps/examples/build --config ${{ matrix.configuration }} --parallel

      - name: Smoke Test Benchmark Corpus
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $env:RASTERM_BENCH_ITERATIONS = '5'
          & build/ci/validation/Release/rasterm-encoder-benchmark.exe | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Installed C and C++ Consumers
        shell: pwsh
        run: |
          cmake --install build/ci --config ${{ matrix.configuration }} --prefix build/install
          cmake -DROOT="$pwd/build/install" -DINSTALL_TREE=ON -P cmake/VerifyReleaseContents.cmake
          cmake -S validation/tests/consumer -B build/consumer -A x64 -DCMAKE_PREFIX_PATH="$pwd/build/install"
          cmake --build build/consumer --config ${{ matrix.configuration }} --parallel
          & "build/consumer/${{ matrix.configuration }}/rasterm-consumer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S validation/tests/c_consumer -B build/c-consumer -A x64 -DCMAKE_PREFIX_PATH="$pwd/build/install"
          cmake --build build/c-consumer --config ${{ matrix.configuration }} --parallel
          & "build/c-consumer/${{ matrix.configuration }}/rasterm-c-consumer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package rasterm
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $projectFile = Get-Content CMakeLists.txt -Raw
          if ($projectFile -notmatch 'project\(rasterm VERSION (\d+\.\d+\.\d+)') {
            throw 'Could not read the rasterm version from CMakeLists.txt.'
          }
          $version = $Matches[1]

          cpack --config build/ci/CPackConfig.cmake -C Release -G ZIP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $archives = @(Get-ChildItem -Filter 'rasterm-*.zip')
          if ($archives.Count -ne 1) {
            throw "Expected one CPack archive, found $($archives.Count)."
          }
          $expectedName = "rasterm-$version.zip"

          $packageRoot = Join-Path $pwd 'build/release-package'
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $packageRoot

          $bindingFiles = @(git ls-files -- bindings)
          if ($bindingFiles.Count -eq 0) {
            throw 'No tracked binding sources were found.'
          }
          foreach ($relativePath in $bindingFiles) {
            $destination = Join-Path $packageRoot $relativePath
            New-Item -ItemType Directory -Path (Split-Path $destination) -Force | Out-Null
            Copy-Item -LiteralPath (Join-Path $pwd $relativePath) -Destination $destination
          }

          Remove-Item -LiteralPath $archives[0].FullName
          Compress-Archive -Path "$packageRoot/*" -DestinationPath $expectedName

      - name: Upload rasterm Package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: rasterm-msvc-x64
          path: rasterm-*.zip
          if-no-files-found: error

  windows-clang-cl:
    name: clang-cl x64 Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure rasterm
        run: >-
          cmake -S . -B build/clang-cl -A x64 -T ClangCL
          -DRASTERM_BUILD_TESTS=ON
          -DRASTERM_BUILD_BENCHMARKS=ON
          -DRASTERM_WARNINGS_AS_ERRORS=ON

      - name: Build and Test rasterm
        run: |
          cmake --build build/clang-cl --config Release --parallel
          ctest --test-dir build/clang-cl -C Release --output-on-failure

      - name: Build rasterm Examples
        run: |
          cmake -S apps/examples -B apps/examples/build -A x64 -T ClangCL
          cmake --build apps/examples/build --config Release --parallel

      - name: Smoke Test Benchmark Corpus
        shell: pwsh
        run: |
          $env:RASTERM_BENCH_ITERATIONS = '5'
          & build/clang-cl/validation/Release/rasterm-encoder-benchmark.exe | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-mingw64:
    name: MinGW64 GCC Release
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf

      - name: Build and Test rasterm
        run: |
          cmake -S . -B build/mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRASTERM_BUILD_TESTS=ON \
            -DRASTERM_BUILD_BENCHMARKS=ON \
            -DRASTERM_WARNINGS_AS_ERRORS=ON
          cmake --build build/mingw --parallel
          ctest --test-dir build/mingw --output-on-failure
          RASTERM_BENCH_ITERATIONS=5 ./build/mingw/validation/rasterm-encoder-benchmark.exe >/dev/null
          cmake --install build/mingw --prefix build/install
          cmake -DROOT="$PWD/build/install" -DINSTALL_TREE=ON -P cmake/VerifyReleaseContents.cmake

      - name: Build rasterm Examples
        run: |
          cmake -S apps/examples -B apps/examples/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build apps/examples/build --parallel

      - name: Verify Installed pkg-config Consumers
        run: |
          export PKG_CONFIG_PATH="$PWD/build/install/lib/pkgconfig"
          pkg-config --libs rasterm
          cmake -S validation/tests/pkgconfig -B build/pkg-consumers -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/pkg-consumers --parallel
          ./build/pkg-consumers/rasterm-pkgconfig-c.exe
          ./build/pkg-consumers/rasterm-pkgconfig-cpp.exe
          dependencies="$(objdump -p build/pkg-consumers/rasterm-pkgconfig-cpp.exe)"
          printf '%s\n' "$dependencies" | grep -i "DLL Name" || true
          if [[ "$dependencies" == *"libstdc++-6.dll"* ]]; then
            echo "pkg-config consumer unexpectedly depends on shared libstdc++" >&2
            exit 1
          fi
          if [[ "$dependencies" != *"libwinpthread-1.dll"* ]]; then
            echo "pkg-config consumer is missing the host-compatible winpthread runtime" >&2
            exit 1
          fi

  windows-asan:
    name: MSVC x64 AddressSanitizer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AddressSanitizer Tests
        run: >-
          cmake -S . -B build/asan -A x64
          -DRASTERM_BUILD_TESTS=ON
          -DRASTERM_ENABLE_ASAN=ON
          -DRASTERM_WARNINGS_AS_ERRORS=ON

      - name: Build and run AddressSanitizer Tests
        run: |
          cmake --build build/asan --config RelWithDebInfo --parallel
          ctest --test-dir build/asan -C RelWithDebInfo --output-on-failure

  windows-fuzz-smoke:
    name: Clang Bounded Fuzz Smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure fuzz targets
        run: >-
          cmake -S . -B build/fuzz -G "Ninja Multi-Config"
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DRASTERM_BUILD_FUZZERS=ON
          -DRASTERM_ENABLE_ASAN=ON
          -DRASTERM_WARNINGS_AS_ERRORS=ON

      - name: Build Fuzz Targets
        run: cmake --build build/fuzz --config Release --parallel

      - name: Run Bounded Seeded Fuzz Smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($name in @('frame_validation', 'damage_rectangles', 'c_structures', 'sixel_writer')) {
            $targets = @(Get-ChildItem build/fuzz -Recurse -File -Filter "rasterm-fuzz-$name.exe")
            if ($targets.Count -ne 1) {
              throw "Expected one executable for $name, found $($targets.Count)."
            }
            $target = $targets[0].FullName
            $runtime = @(Get-ChildItem (Split-Path -Parent $target) -File `
              -Filter 'clang_rt.asan_dynamic-*.dll')
            if ($runtime.Count -eq 0) {
              throw "The Clang ASan runtime was not deployed beside $target."
            }
            $corpus = "validation/tests/fuzz/corpus/$name"
            $artifactDirectory = "build/fuzz/artifacts/$name"
            New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
            Write-Host "::group::Fuzz $name"
            Write-Host "Executable: $target"
            & $target $corpus -seed=1337 -max_total_time=15 -timeout=5 `
              -detect_leaks=0 -artifact_prefix="$artifactDirectory/" -print_final_stats=1
            $exitCode = $LASTEXITCODE
            Write-Host "Exit code: $exitCode"
            Write-Host "::endgroup::"
            if ($exitCode -ne 0) { throw "Fuzzer $name failed with exit code $exitCode." }
          }

      - name: Upload Fuzz Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rasterm-fuzz-failures
          path: build/fuzz/artifacts
          if-no-files-found: ignore

  windows-bindings:
    name: Rust and Python Bindings
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Native Binding Libraries
        run: >-
          cmake -S . -B build/bindings -A x64
          -DRASTERM_BUILD_SHARED_C_API=ON
          -DRASTERM_WARNINGS_AS_ERRORS=ON

      - name: Compile Native Binding Libraries
        run: cmake --build build/bindings --config Release --target rasterm rasterm-shared --parallel

      - name: Test Rust Bindings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:RASTERM_LIB_DIR = "$pwd/build/bindings/Release"
          cargo fmt --manifest-path bindings/rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path bindings/rust/Cargo.toml --workspace --all-targets -- -D warnings
          cargo test --manifest-path bindings/rust/Cargo.toml --workspace

      - name: Test and Package Python Bindings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PYTHONPATH = "$pwd/bindings/python/src"
          $env:RASTERM_LIBRARY = "$pwd/build/bindings/Release/rasterm.dll"
          python -m unittest discover -s bindings/python/tests -v
          $native = "$pwd/bindings/python/src/rasterm/_native"
          New-Item -ItemType Directory -Path $native -Force | Out-Null
          Copy-Item $env:RASTERM_LIBRARY "$native/rasterm.dll"
          python -m pip wheel bindings/python --no-deps --wheel-dir build/wheels
          Remove-Item Env:RASTERM_LIBRARY
          $wheels = @(Get-ChildItem build/wheels -Filter 'rasterm-*.whl')
          if ($wheels.Count -ne 1) { throw "Expected one wheel, found $($wheels.Count)." }
          $wheelPath = $wheels[0].FullName
          python -m pip install --no-deps --target build/wheel-test $wheelPath
          $env:PYTHONPATH = "$pwd/build/wheel-test"
          python -c "import rasterm; assert rasterm.version() == (1, 3, 0)"

  release-master:
    name: Publish rasterm Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [windows-x64, windows-clang-cl, windows-mingw64, windows-asan, windows-fuzz-smoke, windows-bindings]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download Verified rasterm Package
        uses: actions/download-artifact@v4
        with:
          name: rasterm-msvc-x64
          path: release

      - name: Verify Release Payload
        id: package
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem release -Filter 'rasterm-*.zip')
          if ($archives.Count -ne 1) {
            throw "Expected exactly one rasterm archive, found $($archives.Count)."
          }

          $entries = @(tar -tf $archives[0].FullName)
          $unexpected = @($entries | Where-Object {
            $_ -notmatch '^(bindings(?:/.*)?|include(?:/rasterm(?:/.*)?)?|lib(?:/rasterm\.lib)?|share(?:/rasterm(?:/(?:LICENSE|NOTICE|THIRD_PARTY_NOTICES\.md))?)?)/?$'
          })
          if ($unexpected.Count -ne 0) {
            throw "Unexpected release entries: $($unexpected -join ', ')"
          }
          if ($entries -notcontains 'lib/rasterm.lib') {
            throw 'Release archive is missing lib/rasterm.lib.'
          }
          foreach ($requiredBinding in @('bindings/rust/Cargo.toml', 'bindings/python/pyproject.toml')) {
            if ($entries -notcontains $requiredBinding) {
              throw "Release archive is missing $requiredBinding."
            }
          }
          $version = $archives[0].BaseName -replace '^rasterm-', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version derived from archive: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish Versioned Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RASTERM_RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $tag = $env:RASTERM_RELEASE_VERSION
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH "/repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" `
              -f sha="$env:GITHUB_SHA" -F force=true | Out-Null
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "rasterm $tag" `
              --notes 'Automated rasterm build from the latest validated master commit.'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release upload $tag release/*.zip `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
